# GoReleaser configuration for terraform-provider-nc2.
#
# Build matrix (explicit, see `targets:` below):
#   - linux   / amd64
#   - linux   / arm64
#   - darwin  / amd64
#   - darwin  / arm64
#   - windows / amd64
#
# Each target produces a Terraform-Registry-shaped zip archive
# named `terraform-provider-nc2_<version>_<os>_<arch>.zip`, plus
# an aggregated SHA256SUMS file that the `signs:` block GPG-signs.
#
# Cosign keyless signatures and SLSA Level 3 provenance are
# produced by `.github/workflows/release.yml` out of band, against
# the artifacts this file emits. See FR-032 / FR-032a / FR-032b
# for the supply-chain requirements.

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: provider
    binary: '{{ .ProjectName }}_v{{ .Version }}'
    main: ./
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X 'github.com/nutanix/terraform-provider-nc2/internal/provider.version={{ .Version }}'
    env:
      - CGO_ENABLED=0
    # Explicit target list (replaces goos × goarch + ignores). Only
    # these five OS/arch pairs are released; do not add new ones
    # without coordinating with the Registry publishing key.
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: registry
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format: zip
    files:
      - LICENSE

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  # GPG signature on the SHA256SUMS file. Required by the Terraform
  # Registry. The release workflow loads the GPG key from secrets.
  - id: gpg-sumfile
    artifacts: checksum
    cmd: gpg
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    signature: '${artifact}.sig'

snapshot:
  name_template: "{{ .Tag }}-next"

release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
    - title: Other
      order: 999
