name: release

# GoReleaser-driven release pipeline for terraform-provider-nc2.
#
# Trigger
# -------
#   - `push` of a tag matching `vMAJOR.MINOR.PATCH` (Semver) → full
#     release: build, sign, attest, publish a draft GitHub release.
#   - `workflow_dispatch` (manual) → same as the tag push, useful
#     for re-running a release that failed mid-pipeline.
#
# What the pipeline produces
# --------------------------
# For each tag, the goreleaser job (driven by `.goreleaser.yml`)
# builds one zip per supported target:
#
#   | Target          | Archive name suffix       |
#   |-----------------|---------------------------|
#   | linux / amd64   | `_linux_amd64.zip`        |
#   | linux / arm64   | `_linux_arm64.zip`        |
#   | darwin / amd64  | `_darwin_amd64.zip`       |
#   | darwin / arm64  | `_darwin_arm64.zip`       |
#   | windows / amd64 | `_windows_amd64.zip`      |
#
# Plus an aggregated `SHA256SUMS` file, GPG-signed (`.sig`) by the
# release-signing key loaded from `GPG_PRIVATE_KEY` /
# `GPG_PASSPHRASE` repository secrets.
#
# Three downstream jobs add supply-chain attestations:
#   1. `vuln`            — govulncheck + osv-scanner. HIGH/CRITICAL
#                          findings hard-fail the workflow per
#                          FR-032a, before any binaries are built.
#   2. `cosign-sign`     — keyless cosign signatures over every
#                          archive (OIDC-based, no key material).
#   3. `slsa-provenance` — SLSA Level 3 build provenance via
#                          slsa-github-generator.
#
# The combination satisfies FR-032 (signing) and FR-032b
# (attestation).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write       # for GitHub release create / asset upload
  id-token: write       # for cosign keyless signing via OIDC
  packages: write
  attestations: write

env:
  GO_VERSION: '1.24'

jobs:
  vuln:
    name: Vulnerability scan (FR-032a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: osv-scanner
        run: |
          go install github.com/google/osv-scanner/cmd/osv-scanner@latest
          osv-scanner --recursive .

  goreleaser:
    name: GoReleaser (5-target build matrix)
    runs-on: ubuntu-latest
    needs: vuln
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so GoReleaser can derive the
          # changelog from `git log` between tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}
      - name: Compute artifact hashes for SLSA
        id: hashes
        run: |
          set -euo pipefail
          cd dist
          # Aggregate every release artifact into a base64-encoded
          # multi-line string the SLSA generator consumes. The
          # SHA256SUMS file itself is included so the provenance
          # covers it as well.
          HASHES=$(sha256sum *.zip *SHA256SUMS* | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

  cosign-sign:
    name: Cosign keyless sign
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: Sign release archives
        env:
          COSIGN_EXPERIMENTAL: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-fetch artifacts from the GitHub release so we sign
          # the same bytes operators will download.
          mkdir -p dist
          gh release download "${GITHUB_REF#refs/tags/}" --dir dist --pattern '*.zip'
          cd dist
          for f in *.zip; do
            cosign sign-blob \
              --yes \
              --bundle "${f}.cosign.bundle" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "${f}"
          done
          gh release upload "${GITHUB_REF#refs/tags/}" *.sig *.pem *.cosign.bundle

  slsa-provenance:
    name: SLSA Level 3 provenance
    needs: goreleaser
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
